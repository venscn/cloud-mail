name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

# 自定义域名路由（含隐私信息，建议在本地 wrangler.local.toml 中配置）
#routes = [
#	{ pattern = "mail.example.com", custom_domain = true }
#]

[observability]
enabled = true

#[[d1_databases]]
#binding = "db"			#d1数据库绑定名默认不可修改
#database_name = ""		#d1数据库名字
#database_id = ""		#d1数据库id

#[[kv_namespaces]]
#binding = "kv"			#kv绑定名默认不可修改
#id = ""					#kv数据库id

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

[[send_email]]
name = "email"			#CF发件, 配置后优先使用

[[send_email]]
name = "forward"		#站内转发到已验证的其他邮箱，不限制单个地址

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
#domain = []				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""					#管理员的邮箱	示例: admin@example.com
#jwt_secret = ""			#jwt令牌的密钥,随便填一串字符串

# ===== 多渠道发件降级链（本 fork 新增功能）=====
# 渠道优先级: CF email绑定 -> SendPulse SMTP -> Resend -> QQ SMTP
# 每个渠道有独立的每日配额，用量耗尽后自动降级到下一渠道
# 密码类配置请用 wrangler secret put 设置，不要写在这里：
#   wrangler secret put sendpulse_smtp_pass
#   wrangler secret put qq_smtp_pass
#
#sendpulse_smtp_user = ""			#SendPulse SMTP 登录名（SendPulse 后台 SMTP 页面获取）
#sendpulse_smtp_host = ""			#默认 smtp-pulse.com，一般不填
#sendpulse_smtp_port = 465			#默认 465 (SSL)
#sendpulse_daily_limit = 400			#SendPulse 免费版每月 12000 封，按日限 400
#
#resend_daily_limit = 100			#Resend 免费版每日 100 封；resendTokens 在系统设置页配置
#
#qq_smtp_user = ""				#QQ 邮箱地址（兜底渠道，发件人显示为此邮箱）
#qq_smtp_host = ""				#默认 smtp.qq.com，一般不填
#qq_smtp_port = 465				#默认 465 (SSL)
#qq_daily_limit = 100			#QQ 邮箱每日配额（保守值）

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
